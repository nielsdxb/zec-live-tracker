name: Update ZEC status bridge

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest tracker history
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 30             "https://zec-live-tracker-vercel.vercel.app/api/history?limit=12"             -o /tmp/history.json
          jq -e . /tmp/history.json >/dev/null
          cp /tmp/history.json zec-status.json
      - name: Commit snapshot if changed
        shell: bash
        run: |
          if git diff --quiet -- zec-status.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "zec-tracker-bot"
          git config user.email "zec-tracker-bot@users.noreply.github.com"
          git add zec-status.json
          git commit -m "Update ZEC tracker snapshot"
          git push
